spring.application.name=ecommerce-backend
server.port=8080

# ---- Dev profile: H2 in-memory (default) ----
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Switch to MySQL for production by setting env vars and profile=prod ----
# spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASSWORD:password}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProduction1234567890
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200
