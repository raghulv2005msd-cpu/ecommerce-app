<div class="page container">
  <div class="page-header">
    <h1 class="page-title">Manage Products</h1>
    <button class="btn btn-primary" (click)="startCreate()" *ngIf="editingId === null">+ New product</button>
  </div>

  <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

  <div class="card form-card" *ngIf="editingId !== null">
    <h3>{{ editingId ? 'Edit product' : 'New product' }}</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>Name</label>
        <input class="input" [(ngModel)]="form.name" name="name">
      </div>
      <div class="form-group">
        <label>Category</label>
        <input class="input" [(ngModel)]="form.category" name="category">
      </div>
      <div class="form-group">
        <label>Price</label>
        <input class="input" type="number" step="0.01" [(ngModel)]="form.price" name="price">
      </div>
      <div class="form-group">
        <label>Stock quantity</label>
        <input class="input" type="number" [(ngModel)]="form.stockQuantity" name="stockQuantity">
      </div>
      <div class="form-group full">
        <label>Image URL</label>
        <input class="input" [(ngModel)]="form.imageUrl" name="imageUrl">
      </div>
      <div class="form-group full">
        <label>Description</label>
        <textarea class="input" rows="3" [(ngModel)]="form.description" name="description"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" [disabled]="saving" (click)="save()">
        {{ saving ? 'Saving…' : 'Save product' }}
      </button>
      <button class="btn btn-outline" (click)="cancelEdit()">Cancel</button>
    </div>
  </div>

  <p *ngIf="loading">Loading…</p>

  <table class="product-table" *ngIf="!loading && products.length">
    <thead>
      <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>${{ product.price.toFixed(2) }}</td>
        <td>{{ product.stockQuantity }}</td>
        <td class="row-actions">
          <button class="btn btn-outline" (click)="startEdit(product)">Edit</button>
          <button class="btn btn-danger" (click)="deleteProduct(product)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
