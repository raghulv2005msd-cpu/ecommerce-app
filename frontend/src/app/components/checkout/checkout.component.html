<div class="page container narrow">
  <h1 class="page-title">Checkout</h1>

  <div class="card summary-card" *ngIf="cartService.cartItems().length">
    <div class="row" *ngFor="let item of cartService.cartItems()">
      <span>{{ item.product.name }} x{{ item.quantity }}</span>
      <span>${{ (item.product.price * item.quantity).toFixed(2) }}</span>
    </div>
    <div class="row total">
      <span>Total</span>
      <span>${{ cartService.cartTotal().toFixed(2) }}</span>
    </div>
  </div>

  <div class="form-group">
    <label>Shipping address</label>
    <textarea class="input" rows="3" [(ngModel)]="shippingAddress" placeholder="123 Main St, City, Country"></textarea>
  </div>

  <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

  <button
    class="btn btn-primary place-order-btn"
    [disabled]="placingOrder || !cartService.cartItems().length"
    (click)="placeOrder()">
    {{ placingOrder ? 'Placing order…' : 'Place order' }}
  </button>

  <p *ngIf="!cartService.cartItems().length">
    Your cart is empty. <a routerLink="/products">Browse products</a>
  </p>
</div>
