<div class="page container narrow">
  <div class="card auth-card">
    <h1 class="page-title">Log in</h1>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input class="input" type="email" name="email" [(ngModel)]="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="input" type="password" name="password" [(ngModel)]="password" required>
      </div>

      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

      <button class="btn btn-primary submit-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="switch-link">Don't have an account? <a routerLink="/register">Sign up</a></p>
    <p class="hint">Demo admin: admin&#64;ecommerce.com / Admin123!</p>
  </div>
</div>
