<div class="page container narrow">
  <div class="card auth-card">
    <h1 class="page-title">Create your account</h1>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Full name</label>
        <input class="input" type="text" name="fullName" [(ngModel)]="fullName" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input class="input" type="email" name="email" [(ngModel)]="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="input" type="password" name="password" [(ngModel)]="password" required minlength="6">
      </div>

      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

      <button class="btn btn-primary submit-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Creating account…' : 'Sign up' }}
      </button>
    </form>

    <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
